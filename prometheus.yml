global:
  scrape_interval: 1s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: chat-app
    static_configs:
      - targets: ["ws1:8080", "ws2:8080", "ws3:8080"]
